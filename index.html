<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Strike: Mobile Royale (SVG Engine)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #06080c;
            font-family: 'Rajdhani', 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #090e15;
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Tactical CODM / Blood Strike HUD Overlays */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            z-index: 10;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .hud-top-left {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .squad-status {
            background: rgba(10, 14, 22, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-left: 4px solid #00f3ff;
            padding: 8px 14px;
            clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
            backdrop-filter: blur(6px);
        }

        .squad-title {
            font-size: 10px;
            letter-spacing: 2px;
            color: #00f3ff;
            font-weight: 700;
        }

        .squad-count {
            font-size: 22px;
            font-weight: 900;
            font-family: monospace;
            color: #fff;
        }

        .match-telemetry {
            background: rgba(10, 14, 22, 0.85);
            border: 1px solid rgba(255, 170, 0, 0.4);
            padding: 8px 16px;
            border-radius: 4px;
            text-align: center;
            backdrop-filter: blur(6px);
        }

        .telemetry-label {
            font-size: 9px;
            color: #ffaa00;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        .telemetry-val {
            font-size: 18px;
            font-weight: 800;
            font-family: monospace;
        }

        .minimap-container {
            width: 180px;
            height: 180px;
            background: rgba(8, 12, 18, 0.9);
            border: 2px solid rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            position: relative;
            overflow: hidden;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .player-status-card {
            background: linear-gradient(135deg, rgba(12, 18, 28, 0.9), rgba(5, 8, 14, 0.95));
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-bottom: 3px solid #00f3ff;
            padding: 12px 18px;
            width: 260px;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 92% 100%, 0 100%);
            pointer-events: auto;
        }

        .health-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 6px;
            position: relative;
            transform: skewX(-15deg);
            overflow: hidden;
        }

        .health-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f3ff, #0066ff);
            width: 100%;
            transition: width 0.1s linear;
        }

        .shield-bar-bg {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 4px;
            position: relative;
            transform: skewX(-15deg);
            overflow: hidden;
        }

        .shield-bar-fill {
            height: 100%;
            background: #ffaa00;
            width: 100%;
            transition: width 0.1s linear;
        }

        .weapon-hud-card {
            background: rgba(10, 15, 24, 0.9);
            border: 1px solid rgba(255, 170, 0, 0.5);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
            pointer-events: auto;
        }

        .weapon-name {
            font-size: 16px;
            font-weight: 800;
            color: #ffaa00;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .weapon-ammo {
            font-size: 26px;
            font-family: monospace;
            font-weight: 900;
            color: #fff;
        }

        /* On-Screen Mobile Action Controls */
        .mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: none;
            z-index: 15;
        }

        .virtual-joystick {
            width: 130px;
            height: 130px;
            background: rgba(0, 243, 255, 0.08);
            border: 2px solid rgba(0, 243, 255, 0.3);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }

        .joystick-thumb {
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #00f3ff 0%, #0066ff 100%);
            border-radius: 50%;
            position: absolute;
            top: 37.5px;
            left: 37.5px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.8);
            transition: transform 0.05s ease-out;
        }

        .action-buttons-cluster {
            display: grid;
            grid-template-columns: repeat(2, 65px);
            gap: 12px;
            pointer-events: auto;
        }

        .tactical-btn {
            width: 65px;
            height: 65px;
            background: rgba(12, 18, 28, 0.85);
            border: 2px solid rgba(0, 243, 255, 0.5);
            border-radius: 12px;
            color: #00f3ff;
            font-weight: 800;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .tactical-btn:active, .tactical-btn.active {
            background: #00f3ff;
            color: #000;
            transform: scale(0.95);
            box-shadow: 0 0 15px #00f3ff;
        }

        .tactical-btn.primary {
            border-color: #ffaa00;
            color: #ffaa00;
            grid-column: span 2;
            width: 142px;
            height: 55px;
            border-radius: 8px;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .tactical-btn.primary:active {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 15px #ffaa00;
        }

        /* Menus / Modals */
        .modal-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 13, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }

        .modal-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #00f3ff;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .modal-subtitle {
            font-size: 16px;
            color: #8fa4c0;
            letter-spacing: 2px;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .cyber-btn {
            background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%);
            border: none;
            color: #000;
            padding: 16px 45px;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .cyber-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.7);
        }

        .hidden {
            display: none !important;
        }

        /* Floating Damage Text */
        .dmg-popup {
            position: absolute;
            font-family: monospace;
            font-weight: 900;
            font-size: 16px;
            color: #ff3333;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 25;
        }
        .dmg-popup.crit {
            color: #ffaa00;
            font-size: 20px;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="game-container">
    <!-- Main SVG Render Engine -->
    <svg id="svg-engine" viewBox="0 0 3000 3000" preserveAspectRatio="xMidYMid slice">
        <!-- Definitions -->
        <defs>
            <radialGradient id="storm-grad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ff0055" stop-opacity="0.05"/>
                <stop offset="70%" stop-color="#ff0055" stop-opacity="0.25"/>
                <stop offset="100%" stop-color="#9900ff" stop-opacity="0.75"/>
            </radialGradient>
            <radialGradient id="player-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
            </radialGradient>
            <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>

        <!-- World Group (Camera Transform) -->
        <g id="world-group">
            <!-- Tactical Grid & Ground Texture -->
            <rect x="0" y="0" width="3000" height="3000" fill="#090e15" />
            <g id="world-grid" stroke="#121c2c" stroke-width="2">
                <!-- Generated dynamically via JS -->
            </g>

            <!-- Structures & Compounds -->
            <g id="structures-layer">
                <!-- Military Bases / Compounds -->
                <g fill="#0e1624" stroke="#1a283e" stroke-width="4">
                    <rect x="500" y="500" width="400" height="300" rx="10"/>
                    <rect x="2000" y="400" width="500" height="350" rx="10"/>
                    <rect x="1200" y="1300" width="600" height="400" rx="10"/>
                    <rect x="400" y="2100" width="450" height="350" rx="10"/>
                    <rect x="1900" y="2000" width="400" height="450" rx="10"/>
                </g>
                <!-- Interior Details / Obstacles -->
                <g fill="#141f32" stroke="#223450" stroke-width="2">
                    <rect x="550" y="550" width="120" height="80"/>
                    <rect x="730" y="550" width="120" height="80"/>
                    <rect x="2100" y="480" width="150" height="90"/>
                    <rect x="1350" y="1400" width="100" height="180"/>
                    <rect x="1550" y="1400" width="100" height="180"/>
                    <rect x="500" y="2200" width="140" height="90"/>
                    <rect x="2050" y="2100" width="120" height="150"/>
                </g>
            </g>

            <!-- Loot Drops Layer -->
            <g id="loot-layer"></g>

            <!-- Entities Layer (Bots & Player) -->
            <g id="entities-layer"></g>

            <!-- Bullets & Projectiles Layer -->
            <g id="projectiles-layer"></g>

            <!-- Storm Hazard Zone (Shrinking Circle) -->
            <circle id="storm-circle" cx="1500" cy="1500" r="1800" fill="url(#storm-grad)" stroke="#ff0055" stroke-width="8" />
        </g>
    </svg>

    <!-- Tactical HUD Overlays -->
    <div class="hud-overlay">
        <div class="hud-top">
            <div class="hud-top-left">
                <div class="squad-status">
                    <div class="squad-title">OPERATIVES ALIVE</div>
                    <div class="squad-count" id="ui-alive">25</div>
                </div>
                <div class="match-telemetry">
                    <div class="telemetry-label">ZONE COLLAPSE</div>
                    <div class="telemetry-val" id="ui-storm-timer">02:00</div>
                </div>
            </div>
            <!-- Mini-map Radar -->
            <div class="minimap-container">
                <svg id="minimap-svg" viewBox="0 0 3000 3000">
                    <rect x="0" y="0" width="3000" height="3000" fill="#080c12" />
                    <!-- Render mini structures -->
                    <g fill="#1a283e">
                        <rect x="500" y="500" width="400" height="300"/>
                        <rect x="2000" y="400" width="500" height="350"/>
                        <rect x="1200" y="1300" width="600" height="400"/>
                        <rect x="400" y="2100" width="450" height="350"/>
                        <rect x="1900" y="2000" width="400" height="450"/>
                    </g>
                    <!-- Mini Storm Circle -->
                    <circle id="mini-storm" cx="1500" cy="1500" r="1800" fill="none" stroke="#ff0055" stroke-width="25" />
                    <!-- Mini Entities -->
                    <g id="mini-entities"></g>
                </svg>
            </div>
        </div>

        <div class="hud-bottom">
            <div class="player-status-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:13px; font-weight:800; color:#00f3ff; letter-spacing:1px;">OPERATOR // GHOST</span>
                    <span id="ui-kills" style="font-size:12px; font-weight:700; color:#ffaa00;">KILLS: 0</span>
                </div>
                <div class="health-bar-bg">
                    <div class="health-bar-fill" id="ui-hp-fill"></div>
                </div>
                <div class="shield-bar-bg">
                    <div class="shield-bar-fill" id="ui-shield-fill"></div>
                </div>
            </div>

            <div class="weapon-hud-card">
                <div>
                    <div class="weapon-name" id="ui-weapon-name">Assault Rifle</div>
                    <div style="font-size:10px; color:#8fa4c0; letter-spacing:1px;">TACTICAL LOADOUT</div>
                </div>
                <div class="weapon-ammo" id="ui-ammo">30/90</div>
            </div>
        </div>
    </div>

    <!-- On-screen Mobile / Tactical Controls -->
    <div class="mobile-controls" id="mobile-controls">
        <div class="virtual-joystick" id="joystick">
            <div class="joystick-thumb" id="joystick-thumb"></div>
        </div>
        <div class="action-buttons-cluster">
            <button class="tactical-btn" id="btn-reload">RELOAD</button>
            <button class="tactical-btn" id="btn-switch">SWAP</button>
            <button class="tactical-btn primary" id="btn-fire">FIRE / ATTACK</button>
        </div>
    </div>

    <!-- Start Menu Screen -->
    <div id="start-screen" class="modal-screen">
        <div class="modal-title">TACTICAL STRIKE</div>
        <div class="modal-subtitle">SVG Mobile Battle Royale Engine</div>
        <button class="cyber-btn" id="start-btn">DEPLOY INTO ZONE</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="modal-screen hidden">
        <div class="modal-title" id="gameover-title" style="color:#ff3333;">MISSION FAILED</div>
        <div class="modal-subtitle" id="gameover-stats">Eliminated in the hazard zone</div>
        <button class="cyber-btn" id="restart-btn">DEPLOY AGAIN</button>
    </div>
</div>

<script>
    // --- GAME ENGINE STATE & CONFIG ---
    const WORLD_SIZE = 3000;
    let gameRunning = false;
    let matchTime = 120; // 2 mins collapse timer

    const weapons = {
        ar: { name: "M4A1 Assault", damage: 24, fireRate: 120, ammoMax: 30, range: 800, spread: 0.08 },
        shotgun: { name: "Striker Shotgun", damage: 15, fireRate: 600, ammoMax: 8, range: 450, spread: 0.35, pellets: 6 },
        smg: { name: "Vector SMG", damage: 16, fireRate: 80, ammoMax: 35, range: 550, spread: 0.12 }
    };

    let player = {
        x: 1500,
        y: 1500,
        radius: 18,
        speed: 4.5,
        hp: 100,
        maxHp: 100,
        shield: 50,
        maxShield: 50,
        angle: 0,
        weapon: 'ar',
        ammo: 30,
        reserveAmmo: 90,
        kills: 0,
        isFiring: false,
        lastShot: 0
    };

    let bots = [];
    let lootDrops = [];
    let bullets = [];
    let damagePopups = [];

    let storm = {
        x: 1500,
        y: 1500,
        radius: 1600,
        targetRadius: 200,
        shrinkSpeed: 0.35
    };

    let keys = {};
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, down: false };
    let joystickState = { active: false, id: null, startX: 0, startY: 0, dx: 0, dy: 0 };

    // --- INITIALIZATION ---
    function initWorld() {
        // Build grid lines
        const gridGroup = document.getElementById('world-grid');
        let gridHtml = '';
        for (let i = 0; i <= WORLD_SIZE; i += 200) {
            gridHtml += `<line x1="${i}" y1="0" x2="${i}" y2="${WORLD_SIZE}" />`;
            gridHtml += `<line x1="0" y1="${i}" x2="${WORLD_SIZE}" y2="${i}" />`;
        }
        gridGroup.innerHTML = gridHtml;

        // Spawn Bots (24 enemies for 25 player BR)
        bots = [];
        for (let i = 0; i < 24; i++) {
            bots.push({
                id: i,
                x: 300 + Math.random() * (WORLD_SIZE - 600),
                y: 300 + Math.random() * (WORLD_SIZE - 600),
                radius: 18,
                speed: 2.2 + Math.random() * 1.5,
                hp: 100,
                maxHp: 100,
                angle: Math.random() * Math.PI * 2,
                weapon: Math.random() > 0.5 ? 'ar' : 'smg',
                ammo: 30,
                state: 'roam',
                stateTimer: 0,
                targetX: 1500,
                targetY: 1500,
                lastShot: 0
            });
        }

        // Spawn Loot Crates
        lootDrops = [];
        for (let i = 0; i < 35; i++) {
            lootDrops.push({
                x: 200 + Math.random() * (WORLD_SIZE - 400),
                y: 200 + Math.random() * (WORLD_SIZE - 400),
                type: Math.random() > 0.6 ? 'shotgun' : (Math.random() > 0.3 ? 'shield' : 'ammo')
            });
        }
    }

    // --- INPUT LISTENERS ---
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        updatePlayerAim();
    });

    window.addEventListener('mousedown', e => {
        if (e.target.tagName === 'BUTTON' || e.target.closest('.modal-screen') || e.target.closest('.mobile-controls')) return;
        mouse.down = true;
        player.isFiring = true;
    });

    window.addEventListener('mouseup', () => {
        mouse.down = false;
        player.isFiring = false;
    });

    // Touch / Virtual Joystick Handlers
    const joystick = document.getElementById('joystick');
    const thumb = document.getElementById('joystick-thumb');

    joystick.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        joystickState.active = true;
        joystickState.id = touch.identifier;
        const rect = joystick.getBoundingClientRect();
        joystickState.startX = rect.left + rect.width / 2;
        joystickState.startY = rect.top + rect.height / 2;
        handleTouchMove(touch);
    });

    window.addEventListener('touchmove', e => {
        if (!joystickState.active) return;
        for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === joystickState.id) {
                handleTouchMove(e.touches[i]);
            }
        }
    });

    window.addEventListener('touchend', e => {
        if (!joystickState.active) return;
        let released = true;
        for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === joystickState.id) released = false;
        }
        if (released) {
            joystickState.active = false;
            joystickState.dx = 0;
            joystickState.dy = 0;
            thumb.style.transform = `translate(0px, 0px)`;
        }
    });

    function handleTouchMove(touch) {
        let dx = touch.clientX - joystickState.startX;
        let dy = touch.clientY - joystickState.startY;
        const dist = Math.hypot(dx, dy);
        const maxDist = 45;
        if (dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
        }
        thumb.style.transform = `translate(${dx}px, ${dy}px)`;
        joystickState.dx = dx / maxDist;
        joystickState.dy = dy / maxDist;
    }

    // UI Buttons
    document.getElementById('btn-fire').addEventListener('touchstart', () => player.isFiring = true);
    document.getElementById('btn-fire').addEventListener('touchend', () => player.isFiring = false);
    document.getElementById('btn-fire').addEventListener('mousedown', () => player.isFiring = true);
    document.getElementById('btn-fire').addEventListener('mouseup', () => player.isFiring = false);

    document.getElementById('btn-reload').addEventListener('click', reloadWeapon);
    document.getElementById('btn-switch').addEventListener('click', switchWeapon);

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('gameover-screen').classList.add('hidden');
        player.x = 1500;
        player.y = 1500;
        player.hp = 100;
        player.shield = 50;
        player.kills = 0;
        player.ammo = weapons[player.weapon].ammoMax;
        player.reserveAmmo = 120;
        matchTime = 120;
        storm.radius = 1600;
        initWorld();
        gameRunning = true;
    }

    function updatePlayerAim() {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        player.angle = Math.atan2(mouse.y - cy, mouse.x - cx);
    }

    function switchWeapon() {
        const keysList = Object.keys(weapons);
        let idx = keysList.indexOf(player.weapon);
        idx = (idx + 1) % keysList.length;
        player.weapon = keysList[idx];
        player.ammo = weapons[player.weapon].ammoMax;
        document.getElementById('ui-weapon-name').innerText = weapons[player.weapon].name;
        updateHUD();
    }

    function reloadWeapon() {
        const w = weapons[player.weapon];
        let needed = w.ammoMax - player.ammo;
        if (needed <= 0 || player.reserveAmmo <= 0) return;
        let take = Math.min(needed, player.reserveAmmo);
        player.ammo += take;
        player.reserveAmmo -= take;
        updateHUD();
    }

    // --- COMBAT & PROJECTILES ---
    function fireWeapon(shooter, isPlayer = false) {
        const now = Date.now();
        const w = weapons[shooter.weapon];
        if (now - shooter.lastShot < w.fireRate) return;
        if (shooter.ammo <= 0) {
            if (isPlayer) reloadWeapon();
            return;
        }

        shooter.ammo--;
        shooter.lastShot = now;
        if (isPlayer) updateHUD();

        const pellets = w.pellets || 1;
        for (let i = 0; i < pellets; i++) {
            const spreadAngle = shooter.angle + (Math.random() - 0.5) * w.spread;
            bullets.push({
                x: shooter.x + Math.cos(shooter.angle) * 25,
                y: shooter.y + Math.sin(shooter.angle) * 25,
                vx: Math.cos(spreadAngle) * 16,
                vy: Math.sin(spreadAngle) * 16,
                damage: w.damage,
                range: w.range,
                traveled: 0,
                isPlayer: isPlayer
            });
        }
    }

    function spawnDamagePopup(x, y, dmg, isCrit = false) {
        const el = document.createElement('div');
        el.className = `dmg-popup ${isCrit ? 'crit' : ''}`;
        el.innerText = Math.round(dmg);
        // Convert world to screen space
        const screenX = x - player.x + window.innerWidth / 2;
        const screenY = y - player.y + window.innerHeight / 2;
        el.style.left = `${screenX}px`;
        el.style.top = `${screenY}px`;
        document.getElementById('game-container').appendChild(el);
        setTimeout(() => el.remove(), 600);
    }

    // --- MAIN GAME LOOP ---
    let lastTime = performance.now();
    function gameLoop(time) {
        if (!gameRunning) return;
        const dt = (time - lastTime) / 1000;
        lastTime = time;

        update(dt);
        render();

        requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        // Match Timer & Storm Collapse
        matchTime -= dt;
        if (matchTime <= 0) matchTime = 0;
        let mins = Math.floor(matchTime / 60);
        let secs = Math.floor(matchTime % 60);
        document.getElementById('ui-storm-timer').innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;

        if (storm.radius > storm.targetRadius) {
            storm.radius -= storm.shrinkSpeed;
        }

        // Player Movement
        let dx = 0, dy = 0;
        if (keys['w'] || keys['arrowup']) dy -= 1;
        if (keys['s'] || keys['arrowdown']) dy += 1;
        if (keys['a'] || keys['arrowleft']) dx -= 1;
        if (keys['d'] || keys['arrowright']) dx += 1;

        if (joystickState.active) {
            dx = joystickState.dx;
            dy = joystickState.dy;
        }

        if (dx !== 0 && dy !== 0) {
            const len = Math.hypot(dx, dy);
            dx /= len;
            dy /= len;
        }

        player.x += (dx !== 0 || dy !== 0) ? dx * player.speed : 0;
        player.y += (dy !== 0 || dy !== 0) ? dy * player.speed : 0;

        // World Bounds
        player.x = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(WORLD_SIZE - player.radius, player.y));

        if (!joystickState.active && !keys['w'] && !keys['s'] && !keys['a'] && !keys['d']) {
            updatePlayerAim();
        } else if (dx !== 0 || dy !== 0) {
            player.angle = Math.atan2(dy, dx);
        }

        if (player.isFiring) {
            fireWeapon(player, true);
        }

        // Storm Damage Check
        const distToStormCenter = Math.hypot(player.x - storm.x, player.y - storm.y);
        if (distToStormCenter > storm.radius) {
            player.hp -= dt * 10;
            if (player.hp <= 0) triggerGameOver(false);
        }

        // Update Bots AI
        bots.forEach(bot => {
            if (bot.hp <= 0) return;

            const distToPlayer = Math.hypot(player.x - bot.x, player.y - bot.y);

            // Bot FSM State
            if (distToPlayer < 650) {
                bot.state = 'combat';
                bot.targetX = player.x;
                bot.targetY = player.y;
                bot.angle = Math.atan2(player.y - bot.y, player.x - bot.x);
                if (distToPlayer < 450) {
                    fireWeapon(bot, false);
                }
            } else {
                bot.state = 'roam';
                bot.stateTimer -= dt;
                if (bot.stateTimer <= 0) {
                    bot.stateTimer = 4 + Math.random() * 4;
                    bot.targetX = bot.x + (Math.random() - 0.5) * 800;
                    bot.targetY = bot.y + (Math.random() - 0.5) * 800;
                }
                bot.angle = Math.atan2(bot.targetY - bot.y, bot.targetX - bot.x);
            }

            // Move bot
            const moveAngle = Math.atan2(bot.targetY - bot.y, bot.targetX - bot.x);
            bot.x += Math.cos(moveAngle) * bot.speed;
            bot.y += Math.sin(moveAngle) * bot.speed;

            // Bot Storm Check
            if (Math.hypot(bot.x - storm.x, bot.y - storm.y) > storm.radius) {
                bot.hp -= dt * 15;
                if (bot.hp <= 0) {
                    bot.hp = 0;
                    checkAliveCount();
                }
            }
        });

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.traveled += Math.hypot(b.vx, b.vy);

            if (b.traveled >= b.range || b.x < 0 || b.x > WORLD_SIZE || b.y < 0 || b.y > WORLD_SIZE) {
                bullets.splice(i, 1);
                continue;
            }

            // Collision with Player
            if (!b.isPlayer && Math.hypot(b.x - player.x, b.y - player.y) < player.radius) {
                let dmg = b.damage;
                if (player.shield > 0) {
                    player.shield -= dmg;
                    if (player.shield < 0) {
                        player.hp += player.shield;
                        player.shield = 0;
                    }
                } else {
                    player.hp -= dmg;
                }
                spawnDamagePopup(player.x, player.y, dmg);
                bullets.splice(i, 1);
                updateHUD();
                if (player.hp <= 0) triggerGameOver(false);
                continue;
            }

            // Collision with Bots
            if (b.isPlayer) {
                let hitBot = false;
                for (let j = 0; j < bots.length; j++) {
                    let bot = bots[j];
                    if (bot.hp > 0 && Math.hypot(b.x - bot.x, b.y - bot.y) < bot.radius) {
                        bot.hp -= b.damage;
                        spawnDamagePopup(bot.x, bot.y, b.damage, Math.random() > 0.8);
                        hitBot = true;
                        if (bot.hp <= 0) {
                            player.kills++;
                            document.getElementById('ui-kills').innerText = `KILLS: ${player.kills}`;
                            checkAliveCount();
                        }
                        break;
                    }
                }
                if (hitBot) {
                    bullets.splice(i, 1);
                    continue;
                }
            }
        }

        // Loot Pickup Collision
        for (let i = lootDrops.length - 1; i >= 0; i--) {
            let l = lootDrops[i];
            if (Math.hypot(player.x - l.x, player.y - l.y) < 35) {
                if (l.type === 'shield') {
                    player.shield = Math.min(player.maxShield, player.shield + 25);
                } else if (l.type === 'ammo') {
                    player.reserveAmmo += 40;
                } else if (l.type === 'shotgun') {
                    player.weapon = 'shotgun';
                    player.ammo = weapons['shotgun'].ammoMax;
                    document.getElementById('ui-weapon-name').innerText = weapons['shotgun'].name;
                }
                lootDrops.splice(i, 1);
                updateHUD();
            }
        }
    }

    function checkAliveCount() {
        const aliveBots = bots.filter(b => b.hp > 0).length;
        const totalAlive = aliveBots + 1;
        document.getElementById('ui-alive').innerText = totalAlive;
        if (aliveBots === 0) {
            triggerGameOver(true);
        }
    }

    function triggerGameOver(victory) {
        gameRunning = false;
        const screen = document.getElementById('gameover-screen');
        const title = document.getElementById('gameover-title');
        const stats = document.getElementById('gameover-stats');
        screen.classList.remove('hidden');

        if (victory) {
            title.innerText = "VICTORY ROYALE";
            title.style.color = "#00f3ff";
            stats.innerText = `Eliminations: ${player.kills} | Winner Winner, Chicken Dinner!`;
        } else {
            title.innerText = "MISSION FAILED";
            title.style.color = "#ff3333";
            stats.innerText = `Eliminated in the hazard zone. Kills: ${player.kills}`;
        }
    }

    function updateHUD() {
        document.getElementById('ui-hp-fill').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
        document.getElementById('ui-shield-fill').style.width = `${Math.max(0, (player.shield / player.maxShield) * 100)}%`;
        document.getElementById('ui-ammo').innerText = `${player.ammo}/${player.reserveAmmo}`;
    }

    // --- RENDER ENGINE (SVG DOM) ---
    function render() {
        // Camera Follow Player
        const camX = window.innerWidth / 2 - player.x;
        const camY = window.innerHeight / 2 - player.y;
        document.getElementById('world-group').setAttribute('transform', `translate(${camX}, ${camY})`);

        // Update Storm Circle SVG attribute
        const stormEl = document.getElementById('storm-circle');
        stormEl.setAttribute('r', storm.radius);

        const miniStorm = document.getElementById('mini-storm');
        miniStorm.setAttribute('r', storm.radius);

        // Render Loot Crates
        let lootHtml = '';
        lootDrops.forEach(l => {
            let color = l.type === 'shield' ? '#ffaa00' : (l.type === 'shotgun' ? '#ff0055' : '#00f3ff');
            lootHtml += `<g transform="translate(${l.x}, ${l.y})">
                <rect x="-10" y="-10" width="20" height="20" fill="${color}" rx="4" stroke="#fff" stroke-width="2"/>
                <circle cx="0" cy="0" r="4" fill="#090e15"/>
            </g>`;
        });
        document.getElementById('loot-layer').innerHTML = lootHtml;

        // Render Entities (Player & Bots)
        let entitiesHtml = '';
        let miniEntitiesHtml = '';

        // Bots
        bots.forEach(b => {
            if (b.hp <= 0) return;
            entitiesHtml += `<g transform="translate(${b.x}, ${b.y})">
                <circle cx="0" cy="0" r="${b.radius}" fill="#162235" stroke="#ff3333" stroke-width="3"/>
                <line x1="0" y1="0" x2="${Math.cos(b.angle)*24}" y2="${Math.sin(b.angle)*24}" stroke="#ff3333" stroke-width="4" stroke-linecap="round"/>
                <circle cx="0" cy="0" r="6" fill="#ff3333"/>
            </g>`;
            miniEntitiesHtml += `<circle cx="${b.x}" cy="${b.y}" r="25" fill="#ff3333"/>`;
        });

        // Player
        entitiesHtml += `<g transform="translate(${player.x}, ${player.y})">
            <circle cx="0" cy="0" r="35" fill="url(#player-glow)"/>
            <circle cx="0" cy="0" r="${player.radius}" fill="#0d1522" stroke="#00f3ff" stroke-width="4"/>
            <line x1="0" y1="0" x2="${Math.cos(player.angle)*28}" y2="${Math.sin(player.angle)*28}" stroke="#00f3ff" stroke-width="5" stroke-linecap="round"/>
            <circle cx="0" cy="0" r="7" fill="#00f3ff"/>
        </g>`;
        miniEntitiesHtml += `<circle cx="${player.x}" cy="${player.y}" r="35" fill="#00f3ff"/>`;

        document.getElementById('entities-layer').innerHTML = entitiesHtml;
        document.getElementById('mini-entities').innerHTML = miniEntitiesHtml;

        // Render Bullets
        let bulletsHtml = '';
        bullets.forEach(b => {
            let col = b.isPlayer ? '#00f3ff' : '#ff3333';
            bulletsHtml += `<line x1="${b.x}" y1="${b.y}" x2="${b.x - b.vx}" y2="${b.y - b.vy}" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`;
        });
        document.getElementById('projectiles-layer').innerHTML = bulletsHtml;
    }

    // Initialize display on load
    initWorld();
    updateHUD();
</script>
</body>
</html>
